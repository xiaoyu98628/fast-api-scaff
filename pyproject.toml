[project]
name = "fast-api-scaff"
version = "0.1.0"
description = "A practical FastAPI scaffold with config, middleware, response schema, and database basics."
readme = "README.md"
requires-python = ">=3.14"
authors = [
    {name = "CaoGaoYu", email = "1765841705@qq.com"}
]
dependencies = [
    "fastapi>=0.139.0",
    "uvicorn>=0.51.0",

    "sqlalchemy[asyncio]>=2.0.51",
    "alembic>=1.18.5",

    "aiomysql>=0.3.2", # mysql async
    "aiosqlite>=0.22.1", # sqlite async
    "asyncpg>=0.31.0", # postgresql async

    "pymysql>=1.1.0", # mysql sync (migrations)
    "psycopg2-binary>=2.9.0", # postgresql sync (migrations)

    "pydantic-settings>=2.14.2",
    "pydantic>=2.13.4",
]

[project.optional-dependencies]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.0",
]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "black>=24.0.0",
    "ruff>=0.15.20",
]

# 目标 Python 版本
[tool.ty.environment]
python-version = "3.14"

# 镜像源
#[[tool.uv.index]]
#url = "https://mirrors.cloud.tencent.com/pypi/simple"
#default = true

[tool.black]
line-length = 150

[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
