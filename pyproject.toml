[project]
name = "fast-api-scaff"
version = "0.1.0"
description = "A practical FastAPI scaffold with config, middleware, response schema, and database basics."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "bcrypt>=4.0.0",
    "aiomysql>=0.3.2",
    "alembic>=1.18.4",
    "mako>=1.3.12", # 安全覆盖：GHSA-v92g-xgxw-vvmm
    "cryptography>=48.0.0",
    "fastapi>=0.135.3",
    "PyJWT>=2.10.1",
    "pydantic-settings>=2.11.0",
    "redis>=7.4.0",
    "sqlalchemy[asyncio]>=2.0.49",
    "uvicorn>=0.44.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "black>=24.0.0",
    "ruff>=0.5.0",
]

# 目标 Python 版本
[tool.ty.environment]
python-version = "3.14"

## 镜像源
#[[tool.uv.index]]
#url = "https://mirrors.cloud.tencent.com/pypi/simple"
#default = true

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]