services:
  service:
    build:
      context: ./
      dockerfile: Dockerfile
    env_file:
      - ./.env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    container_name: ${APP_NAME}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - .:/app
      - /app/.venv
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: no
    networks:
      - fast-api-scaff

  worker:
    build:
      context: ./
      dockerfile: Dockerfile
    env_file:
      - ./.env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    container_name: ${APP_NAME}-worker
    volumes:
      - .:/app
      - /app/.venv
    command: ["python", "-m", "app.worker"]
    restart: no
    networks:
      - fast-api-scaff

networks:
  fast-api-scaff:
    name: fast-api-scaff
